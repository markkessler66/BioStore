[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phynetpy-datastore"
version = "0.1.0"
description = "Client for the BioStore local data hub, for use inside PhyNetPy."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "PhyNetPy" }]
dependencies = []

[tool.setuptools]
packages = ["phynetpy_datastore"]
